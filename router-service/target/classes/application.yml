server:
  port: 8080

spring:
  application:
    name: agentmesh-router
  datasource:
    url: jdbc:h2:mem:agentmeshdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

agentmesh:
  algorand:
    node-url: http://localhost:4001
    network: testnet
    escrow-address: AGENTMESH_ESCROW_CONTRACT_7X9V
    simulation-mode: true
  scoring:
    reputation-weight: 0.35
    success-rate-weight: 0.25
    confidence-weight: 0.20
    price-weight: 0.10
    eta-weight: 0.10
